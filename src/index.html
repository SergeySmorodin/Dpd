<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trello</title>
</head>
<body>
  <div class="container">
    <!-- <h1>Доска задач</h1> -->
    <div class="board">
      <div class="column" id="column-1">
        <h2>TODO</h2>
        <div class="cards" id="cards-1"></div>
        <button class="add-card-btn" data-column="1">+ Add another card</button>
      </div>
      <div class="column" id="column-2">
        <h2>IN PROGRESS</h2>
        <div class="cards" id="cards-2"></div>
        <button class="add-card-btn" data-column="2">+ Add another card</button>
      </div>
      <div class="column" id="column-3">
        <h2>DONE</h2>
        <div class="cards" id="cards-3"></div>
        <button class="add-card-btn" data-column="3">+ Add another card</button>
      </div>
    </div>
  </div>
</body>
</html>
